# ------------------------------------------------------------
#  Craft apps (github.com/storytold) – self-hosted web versions
#
#  craftapps-web    nginx, serves the installed apps under /<app>/
#                   (e.g. /photocraft/) plus an overview at /
#  craftapps-admin  admin UI: installs and removes apps, automatic
#                   updates per app, push notifications via Gotify
#
#  Deploy: Portainer BE, stack from the Git repo with
#  "Enable relative path volumes" – setup see README.md
#
#  Zoraxy: craft.example.com       -> 172.18.0.22:80   (apps)
#          craft-admin.example.com -> 172.18.0.23:3000 (admin UI)
#  (HTTPS matters: browsers only allow WebGPU and the clipboard in a secure context)
# ------------------------------------------------------------
services:
  # --------------------------------------------------------
  #  nginx – serves static files (TLS is done by Zoraxy)
  # --------------------------------------------------------
  craftapps-web:
    image: nginx:alpine
    container_name: CraftApps
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.monitor-only=false"
    ports:
      - 8085:80 # optional, only needed if Zoraxy goes via the host port
    volumes:
      - data:/srv/craftapps:ro
      # Straight from the repo – needs "Enable relative path volumes" in Portainer.
      # nginx reads the file only at startup: restart it after a change.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      custom:
        ipv4_address: 172.18.0.22 # <-- adjust: free IP in the custom network

  # --------------------------------------------------------
  #  Admin UI and automatic updates
  # --------------------------------------------------------
  craftapps-admin:
    # Built by Gitea Actions on every change in admin/ (.gitea/workflows/admin-image.yaml),
    # e.g. gitea.example.com/user/craftapps-admin:latest
    image: ${CRAFTAPPS_ADMIN_IMAGE:?in Portainer unter Environment variables setzen}
    container_name: CraftApps-Admin
    restart: unless-stopped
    labels:
      # Watchtower pulls new admin images from the Gitea registry
      - "com.centurylinklabs.watchtower.monitor-only=false"
    environment:
      - TZ=Europe/Berlin
      - DB_HOST=MySQL # <-- adjust: name or IP of your MySQL container
      - DB_PORT=3306
      - DB_NAME=craftapps
      - DB_USER=craftapps
      - DB_PASSWORD=${CRAFTAPPS_DB_PASSWORD:?in Portainer unter Environment variables setzen}
      # First account – only created while there is no user yet
      - INITIAL_ADMIN_USER=admin
      - INITIAL_ADMIN_PASSWORD=${CRAFTAPPS_ADMIN_PASSWORD:?in Portainer unter Environment variables setzen}
      # Optional: GitHub token, only needed for check intervals below ~20 minutes
      # - GITHUB_TOKEN=github_pat_...
    # ports:
    #   - 8086:3000 # optional, only needed if Zoraxy goes via the host port
    volumes:
      - data:/data
    # Reachable from the internet and downloads files – as few privileges as possible
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      custom:
        ipv4_address: 172.18.0.23 # <-- adjust: free IP in the custom network

volumes:
  data:
    name: craftapps_data # apps and overview, managed by craftapps-admin

networks:
  custom:
    external: true
