# ------------------------------------------------------------
#  Craft apps (github.com/storytold) – self-hosted web versions
#
#  craftapps-web    nginx, serves the installed apps under /<app>/
#                   (e.g. /photocraft/) plus an overview at /
#  craftapps-admin  admin UI: installs and removes apps, automatic
#                   updates per app, push notifications via Gotify
#
#  Deploy: Portainer BE, stack from the Git repo with
#  "Enable relative path volumes" – setup see README.md
#
#  Runs locally by default: apps on port 8080, admin UI on port 8081.
#  For public access put a reverse proxy with HTTPS in front, e.g. Zoraxy:
#    craft.example.com       -> <host>:8080 (apps)
#    craft-admin.example.com -> <host>:8081 (admin UI)
#  (HTTPS matters: browsers only allow WebGPU and the clipboard in a secure context)
# ------------------------------------------------------------
services:
  # --------------------------------------------------------
  #  nginx – serves static files (TLS is up to a reverse proxy)
  # --------------------------------------------------------
  craftapps-web:
    image: nginx:alpine
    container_name: CraftApps
    restart: unless-stopped
    labels:
      # Watchtower keeps nginx up to date; CRAFTAPPS_WATCHTOWER=false leaves that to
      # Portainer, e.g. via its webhook after the build
      - "com.centurylinklabs.watchtower.enable=${CRAFTAPPS_WATCHTOWER:-true}"
      - "com.centurylinklabs.watchtower.monitor-only=false"
    ports:
      - ${CRAFTAPPS_WEB_PORT:-8080}:80
    volumes:
      - data:/srv/craftapps:ro
      # Straight from the repo – needs "Enable relative path volumes" in Portainer.
      # nginx reads the file only at startup: restart it after a change.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        ipv4_address: ${CRAFTAPPS_WEB_IP:-} # optional, see networks below

  # --------------------------------------------------------
  #  Admin UI and automatic updates
  # --------------------------------------------------------
  craftapps-admin:
    # Built by GitHub Actions on every change in admin/ (.github/workflows/admin-image.yaml).
    # For another image, e.g. from the Gitea registry, set CRAFTAPPS_ADMIN_IMAGE in Portainer
    image: ${CRAFTAPPS_ADMIN_IMAGE:-ghcr.io/pr0gh4nt3r/craftapps-admin:latest}
    container_name: CraftApps-Admin
    restart: unless-stopped
    labels:
      # Watchtower pulls new admin images from the registry; CRAFTAPPS_WATCHTOWER=false
      # leaves that to Portainer, e.g. via its webhook after the build
      - "com.centurylinklabs.watchtower.enable=${CRAFTAPPS_WATCHTOWER:-true}"
      - "com.centurylinklabs.watchtower.monitor-only=false"
    ports:
      - ${CRAFTAPPS_ADMIN_PORT:-8081}:3000
    environment:
      - TZ=Europe/Berlin
      # The database must be reachable from this container: via the host's address or,
      # in a shared network, via the container name – see README.md
      - DB_HOST=${CRAFTAPPS_DB_HOST:?in Portainer unter Environment variables setzen}
      - DB_PORT=${CRAFTAPPS_DB_PORT:-3306}
      - DB_NAME=craftapps
      - DB_USER=craftapps
      - DB_PASSWORD=${CRAFTAPPS_DB_PASSWORD:?in Portainer unter Environment variables setzen}
      # First account – only created while there is no user yet
      - INITIAL_ADMIN_USER=admin
      - INITIAL_ADMIN_PASSWORD=${CRAFTAPPS_ADMIN_PASSWORD:?in Portainer unter Environment variables setzen}
      # Optional: GitHub token, only needed for check intervals below ~20 minutes
      # - GITHUB_TOKEN=github_pat_...
    volumes:
      - data:/data
    # May be reachable from the internet and downloads files – as few privileges as possible
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: ${CRAFTAPPS_ADMIN_IP:-} # optional, see networks below

volumes:
  data:
    name: craftapps_data # apps and overview, managed by craftapps-admin

networks:
  # Without further settings the stack gets its own network. To put both containers into an
  # existing network instead, e.g. the one of MySQL or the reverse proxy, set
  # CRAFTAPPS_NETWORK to its name and CRAFTAPPS_NETWORK_EXTERNAL=true in Portainer – and
  # optionally fixed IPs via CRAFTAPPS_WEB_IP and CRAFTAPPS_ADMIN_IP, which only works in a
  # network with its own subnet. See README.md, "Shared network".
  default:
    name: ${CRAFTAPPS_NETWORK:-craftapps_default} # an empty name fails at deploy time
    external: ${CRAFTAPPS_NETWORK_EXTERNAL:-false}
