# Builds the admin image (ARM64 for the Raspberry Pi) and pushes it to this Gitea's
# container registry: <gitea-host>/<owner>/craftapps-admin.
# Watchtower or Portainer pull it from there.
#
# Requires the repo secret REGISTRY_TOKEN – a token of the repo owner with the
# permission "package: Read and Write" (see README.md).
name: Verwaltung bauen

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".gitea/workflows/admin-image.yaml"
  # Rebuild weekly so security updates for Node and Alpine get in
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Registry und Image-Namen bestimmen
        run: |
          registry="${GITHUB_SERVER_URL#*://}"
          registry="${registry%/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE=${registry}/${owner}/craftapps-admin" >> "$GITHUB_ENV"

      # Only needed if the runner itself isn't ARM64 – harmless on the Pi
      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei der Gitea-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: admin
          platforms: linux/arm64
          pull: true # always the latest node:24-alpine
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ gitea.sha }}
