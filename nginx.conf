# ------------------------------------------------------------
#  nginx für die Craft-Apps – nur HTTP, TLS macht Zoraxy davor
#  Setzt die Empfehlungen aus der HOSTING.md der Apps um
# ------------------------------------------------------------
server {
    # default_server: gilt für jeden Hostnamen, den Zoraxy durchreicht
    listen 80 default_server;
    server_name _;
    root /srv/craftapps;
    index index.html;

    # /photocraft -> /photocraft/ als relativer Redirect, damit hinter
    # Zoraxy kein http://...:80 im Location-Header landet
    absolute_redirect off;

    # Der Updater legt .wasm/.js zusätzlich als .gz ab – die gehen ohne
    # CPU-Last raus (spart ~60 %); alles andere komprimiert nginx selbst
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript application/json
               text/css text/markdown text/plain image/svg+xml;

    # Interne Ordner und Dateien (.state, .tmp, .htaccess, Temp-Dateien) nie ausliefern
    location ~ /\. {
        return 404;
    }

    # Dateien mit Content-Hash im Namen (z.B. photocraft-web-4cc0a6fe355463b6_bg.wasm)
    # ändern sich nie -> dürfen ewig gecacht werden
    # (Regex in Anführungszeichen, sonst hält nginx die { } für einen Block)
    location ~ "-[0-9a-f]{16}(?:_bg)?\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Alles andere immer revalidieren: index.html, aber auch die .wasm/.js der
    # Apps mit festen Dateinamen (LightCraft, EffectCraft, FilmCraft) – sonst
    # hingen Browser nach einem Update auf der alten Version fest
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
