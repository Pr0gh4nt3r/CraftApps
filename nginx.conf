# ------------------------------------------------------------
#  nginx for the craft apps – plain HTTP, TLS is up to a reverse proxy in front
#  Implements the recommendations from the apps' HOSTING.md
# ------------------------------------------------------------
server {
    # default_server: applies to every host name, including those a reverse proxy passes on
    listen 80 default_server;
    server_name _;
    root /srv/craftapps;
    index index.html;

    # /photocraft -> /photocraft/ as a relative redirect so that behind a
    # reverse proxy no http://...:80 ends up in the Location header
    absolute_redirect off;

    # The admin also stores .wasm/.js as .gz – those go out without
    # CPU load (saves ~60 %); nginx compresses everything else itself
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript application/json
               text/css text/markdown text/plain image/svg+xml;

    # Never serve internal folders and files (.tmp, .htaccess, temp files)
    location ~ /\. {
        return 404;
    }

    # Files with a content hash in their name (e.g. photocraft-web-4cc0a6fe355463b6_bg.wasm)
    # never change -> may be cached forever
    # (regex in quotes, otherwise nginx takes the { } for a block)
    location ~ "-[0-9a-f]{16}(?:_bg)?\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Always revalidate everything else: index.html, but also the .wasm/.js of
    # apps with fixed file names (LightCraft, EffectCraft, FilmCraft) – otherwise
    # browsers would stay stuck on the old version after an update
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
