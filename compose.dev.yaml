# ------------------------------------------------------------
#  Local development: MySQL for the admin
#    docker compose -f compose.dev.yaml up -d
#
#  The admin itself runs with npm, see README (Entwicklung).
#  The credentials match admin/.env.example – for local use only.
# ------------------------------------------------------------
name: craftapps-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=craftapps
      - MYSQL_USER=craftapps
      - MYSQL_PASSWORD=craftapps-dev
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    ports:
      - 127.0.0.1:3306:3306 # reachable from this machine only
    volumes:
      - mysql:/var/lib/mysql

volumes:
  mysql:
