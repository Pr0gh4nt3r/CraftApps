# ------------------------------------------------------------
#  Lokale Entwicklung: MySQL für die Verwaltung
#    docker compose -f compose.dev.yaml up -d
#
#  Die Verwaltung selbst läuft mit npm, siehe README (Entwicklung).
#  Die Zugangsdaten passen zu admin/.env.example – nur für lokal.
# ------------------------------------------------------------
name: craftapps-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=craftapps
      - MYSQL_USER=craftapps
      - MYSQL_PASSWORD=craftapps-dev
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    ports:
      - 127.0.0.1:3306:3306 # nur von diesem Rechner aus erreichbar
    volumes:
      - mysql:/var/lib/mysql

volumes:
  mysql:
